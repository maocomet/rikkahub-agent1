name: Release Debug APK

# Triggered by pushing a tag of the form v*-test (e.g. v0.1-test, v0.2-test).
# Builds the same unsigned/debug APKs as build-debug-apk.yml and publishes
# them as a GitHub Release. This is a personal debug build: it deliberately
# does NOT use the author's release keystore.
on:
  push:
    tags:
      - 'v*-test'

permissions:
  contents: write

jobs:
  release-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # :web:installWebUiDeps runs `bun install --frozen-lockfile` but web-ui/
      # only tracks pnpm-lock.yaml (no bun.lock), so the frozen install cannot
      # run on a clean checkout. Installing up-front also makes the Gradle task
      # up-to-date on the first build (its outputs.dir is node_modules/).
      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      # web-ui/pnpm-workspace.yaml declares allowBuilds (pnpm>=10 syntax) and no
      # packages field; pnpm 9 rejects that with "packages field missing or empty".
      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Pre-install web-ui dependencies
        working-directory: web-ui
        run: bun install

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # .agenttest builds shipped from CI must keep ONE signing identity so testers can install a
      # new build over the old one (and keep app data) instead of uninstalling first. The fixed
      # keystore is never committed: it lives base64-encoded in a repo Secret and is decoded here.
      # Missing secrets FAIL the job loudly — never fall back to AGP's throwaway per-run debug key.
      - name: Materialize fixed .agenttest signing keystore
        env:
          AGENTTEST_KEYSTORE_B64: ${{ secrets.RIKKAHUB_AGENTTEST_KEYSTORE_BASE64 }}
          AGENTTEST_STORE_PASSWORD: ${{ secrets.RIKKAHUB_AGENTTEST_STORE_PASSWORD }}
          AGENTTEST_KEY_ALIAS: ${{ secrets.RIKKAHUB_AGENTTEST_KEY_ALIAS }}
          AGENTTEST_KEY_PASSWORD: ${{ secrets.RIKKAHUB_AGENTTEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${AGENTTEST_KEYSTORE_B64:?Missing RIKKAHUB_AGENTTEST_KEYSTORE_BASE64 secret — see docs/agenttest-fixed-signing.md}"
          : "${AGENTTEST_STORE_PASSWORD:?Missing RIKKAHUB_AGENTTEST_STORE_PASSWORD secret}"
          : "${AGENTTEST_KEY_ALIAS:?Missing RIKKAHUB_AGENTTEST_KEY_ALIAS secret}"
          : "${AGENTTEST_KEY_PASSWORD:?Missing RIKKAHUB_AGENTTEST_KEY_PASSWORD secret}"
          KEYSTORE="$RUNNER_TEMP/rikkahub-agenttest.keystore"
          echo "$AGENTTEST_KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::Decoded keystore is empty — check RIKKAHUB_AGENTTEST_KEYSTORE_BASE64"
            exit 1
          fi
          # Confirm the keystore opens and the alias exists before spending a build on it.
          keytool -list -keystore "$KEYSTORE" \
            -storepass "$AGENTTEST_STORE_PASSWORD" -alias "$AGENTTEST_KEY_ALIAS" >/dev/null
          # Export for the Gradle and verification steps below.
          echo "RIKKAHUB_AGENTTEST_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "RIKKAHUB_AGENTTEST_STORE_PASSWORD=$AGENTTEST_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RIKKAHUB_AGENTTEST_KEY_ALIAS=$AGENTTEST_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RIKKAHUB_AGENTTEST_KEY_PASSWORD=$AGENTTEST_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          # Fail closed: Gradle must refuse to fall back to a throwaway debug signature.
          RIKKAHUB_AGENTTEST_REQUIRED: "true"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # :web:buildWebUi (pnpm run build) fails with a bare exit code 1 while
      # Gradle's concurrent task output buries the real react-router/vite error.
      # Retry it standalone so the actual error lands at the end of the log.
      - name: Diagnose web-ui build (on failure)
        if: failure()
        working-directory: web-ui
        run: |
          echo "=== pnpm $(pnpm -v 2>/dev/null) / node $(node -v 2>/dev/null) ==="
          echo "=== retry: pnpm run build (tail 100) ==="
          pnpm run build 2>&1 | tail -100 || true

      - name: Collect debug APKs
        run: |
          ls -la app/build/outputs/apk/debug/*.apk

      # Refuse to publish anything not signed by the fixed keystore. Also prints the certificate
      # SHA-256; the same keystore on every run is what lets testers overwrite-install newer builds.
      - name: Verify .agenttest APKs use the fixed signing key
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found under \$ANDROID_HOME/build-tools; skipping cert comparison"
            exit 0
          fi
          expected="$(
            keytool -list -v -keystore "$RIKKAHUB_AGENTTEST_KEYSTORE" \
              -storepass "$RIKKAHUB_AGENTTEST_STORE_PASSWORD" \
              -alias "$RIKKAHUB_AGENTTEST_KEY_ALIAS" \
              | sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
              | head -n1 | tr -d ':' | tr 'A-F' 'a-f'
          )"
          [ -n "$expected" ] || { echo "::error::Could not read certificate from the agent-test keystore"; exit 1; }
          for apk in "$GITHUB_WORKSPACE"/app/build/outputs/apk/debug/*.apk; do
            [ -f "$apk" ] || continue
            actual="$(
              "$APKSIGNER" verify --print-certs "$apk" \
              | sed -nE 's/^.*SHA-256 digest: ([0-9A-Fa-f:]+)$/\1/p' \
              | head -n1 | tr -d ':' | tr 'A-F' 'a-f'
            )"
            [ -n "$actual" ] || { echo "::error::Could not read signing certificate from $apk"; exit 1; }
            if [ "$actual" != "$expected" ]; then
              echo "::error::$apk is NOT signed by the fixed agent-test keystore (expected $expected, got $actual)"
              exit 1
            fi
            echo "$(basename "$apk") -> fixed agent-test key sha256: $actual"
          done

      # Publish the debug APKs as a GitHub Release. Uses gh with the default
      # GITHUB_TOKEN (no PAT needed). If a Release already exists for this tag,
      # we fail loudly instead of silently overwriting the old one.
      - name: Create GitHub Release and upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk_dir=app/build/outputs/apk/debug
          for apk in \
            "$apk_dir/app-universal-debug.apk" \
            "$apk_dir/app-arm64-v8a-debug.apk" \
            "$apk_dir/app-x86_64-debug.apk"; do
            if [ ! -f "$apk" ]; then
              echo "Missing expected APK: $apk" >&2
              exit 1
            fi
          done

          # Refuse to overwrite an existing Release/tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists for tag $TAG; refusing to overwrite." >&2
            exit 1
          fi

          {
            echo "Personal debug build of RikkaHub Agent."
            echo ""
            echo "applicationId:"
            echo "me.rerere.rikkahub.agenttest"
            echo ""
            echo "Recommended:"
            echo "app-universal-debug.apk"
            echo ""
            echo "ARM64-only:"
            echo "app-arm64-v8a-debug.apk"
            echo ""
            echo "This build can coexist with the official RikkaHub app."
          } > release-body.md

          gh release create "$TAG" \
            "$apk_dir/app-universal-debug.apk" \
            "$apk_dir/app-arm64-v8a-debug.apk" \
            "$apk_dir/app-x86_64-debug.apk" \
            --title "RikkaHub Agent ${TAG}" \
            --notes-file release-body.md
