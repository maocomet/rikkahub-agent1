name: Migration instrumentation (disposable emulator)

# Disposable-emulator gate for the Room schema/migration/reconcile chain.
#
# This runs the instrumentation tests that build-debug-apk.yml deliberately cannot: that workflow
# only builds :app and runs JVM unit tests, so androidTest sources there are neither compiled nor
# executed, and the managed device is never started. A migration is not proven by a JVM contract
# test or a schema diff — it is proven by opening a real v49 database, running the migration and
# letting Room validate the whole resulting schema.
#
# Manual dispatch only, on purpose: this starts an emulator and takes far longer than the APK
# workflow, so it is not wired to every push yet.
on:
  workflow_dispatch:

jobs:
  migration-instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Gradle Managed Device below runs a real emulator, which needs /dev/kvm. GitHub's Linux
      # runners are themselves VMs with nested virtualisation enabled, but /dev/kvm is owned by
      # group kvm with 0660, so the runner user cannot open it until these perms are widened.
      # Without this the GMD task fails with "KVM is required to run this AVD".
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # Mirrors the APK workflow: :web:installWebUiDeps runs `bun install --frozen-lockfile` but
      # web-ui/ tracks only pnpm-lock.yaml, so the deps are installed up-front to keep the Gradle
      # task up-to-date on the first build.
      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Pre-install web-ui dependencies
        working-directory: web-ui
        run: bun install

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-migration-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # RIKKAHUB_AGENTTEST_REQUIRED is deliberately NOT set. These builds are installed onto a
      # throwaway emulator and never distributed, so they may use the runner's debug key; requiring
      # the fixed agent-test keystore here would demand distribution secrets for no benefit.
      #
      # The class filter keeps the first version to the S2 migration/reconcile chain. Everything
      # else in androidTest still has to compile, so the run also proves those sources build.
      - name: Run migration instrumentation on the managed device
        run: |
          chmod +x gradlew
          # Built as one variable rather than a backslash-continued argument: a line continuation
          # after `class=` would splice the next line's indentation into the value.
          CLASSES="me.rerere.rikkahub.data.db.migrations.Migration_49_50_Test"
          # v51 is additive, so the interesting half is that it validates against the live
          # @Entity definitions AND that the two UNIQUE indices really are unique — a name-only
          # check would pass a migration that created them non-unique, which is the difference
          # between "one copy per picture" being an invariant and being a hope.
          CLASSES="$CLASSES,me.rerere.rikkahub.data.db.migrations.Migration_50_51_Test"
          # v52 is additive too, and its interesting half is the *default*: a v51 approval row has
          # no continuation_mode and must read back as RESUME_COMMAND once the column lands,
          # because that is what the row meant when it was written.
          CLASSES="$CLASSES,me.rerere.rikkahub.data.db.migrations.Migration_51_52_Test"
          CLASSES="$CLASSES,me.rerere.rikkahub.data.db.migrations.AppDatabaseEveryAdjacentMigrationTest"
          CLASSES="$CLASSES,me.rerere.rikkahub.data.db.AppDatabaseV50BackupRestoreRoundTripTest"
          CLASSES="$CLASSES,me.rerere.rikkahub.data.db.ImportedDatabaseReconcilerGrantRestoreTest"
          # Cat Garden's post delete relies on ON DELETE CASCADE, which no JVM contract test can
          # prove — the fake only reproduces the constraint. This one runs against real SQLite.
          CLASSES="$CLASSES,me.rerere.rikkahub.data.db.SpacePostDeletionCascadeTest"
          # The Claude P Koin graph test. It has to be named here explicitly: the runner-arg
          # filter is a whitelist, so without this line the class is compiled and never executed.
          CLASSES="$CLASSES,me.rerere.rikkahub.data.claudep.ClaudePKoinGraphTest"
          echo "Instrumentation filter: $CLASSES"
          ls -l /dev/kvm
          ./gradlew :app:p5DisposablePixel6Api35DebugAndroidTest --no-parallel \
            -Pandroid.testInstrumentationRunnerArguments.class="$CLASSES"

      # A green Gradle task is not by itself proof that the named classes ran: the runner-arg filter
      # silently matches nothing if a class name is wrong. Parse the JUnit XML the device produced
      # and print every test case with its outcome.
      - name: Report executed instrumentation tests
        if: always()
        run: |
          results=app/build/outputs/androidTest-results
          if [ ! -d "$results" ]; then
            echo "::error::No instrumentation results at $results — did the managed device run?"
            exit 1
          fi
          echo "=== result XML files ==="
          find "$results" -name '*.xml' | sort
          echo
          echo "=== per-test outcomes ==="
          python3 - "$results" <<'PY'
          import sys, glob, xml.etree.ElementTree as ET
          files = sorted(glob.glob(sys.argv[1] + "/**/*.xml", recursive=True))
          if not files:
              print("NO RESULT XML FOUND")
              raise SystemExit(1)
          total = failures = errors = skipped = 0
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError as exc:
                  print(f"  [unparsable] {path}: {exc}")
                  continue
              for suite in ([root] if root.tag == "testsuite" else root.iter("testsuite")):
                  name = suite.get("name", "?")
                  for case in suite.iter("testcase"):
                      total += 1
                      bad = case.find("failure") is not None
                      err = case.find("error") is not None
                      skip = case.find("skipped") is not None
                      failures += bad
                      errors += err
                      skipped += skip
                      state = "FAIL" if bad else "ERROR" if err else "SKIP" if skip else "PASS"
                      print(f"  {state}  {name}.{case.get('name')}")
                      node = case.find("failure") if bad else case.find("error") if err else None
                      if node is not None:
                          head = (node.get("message") or "").strip().splitlines()
                          for line in head[:6]:
                              print(f"        {line}")
          print()
          print(f"total={total} passed={total-failures-errors-skipped} "
                f"failures={failures} errors={errors} skipped={skipped}")
          if failures or errors:
              raise SystemExit(1)
          if total == 0:
              print("::error::Result XML contained zero test cases")
              raise SystemExit(1)
          PY

      # A green task is not proof that a *specific* class ran: the runner-arg filter silently
      # matches nothing for a renamed or deleted class. Assert the required class by name, from the
      # XML the device produced.
      - name: Verify required Claude P Koin graph tests executed
        if: always()
        run: |
          set -uo pipefail
          # Asserted by class name AND by the exact executed test count, parsed from the XML the
          # device produced. A class-name-only check would pass if some of its methods silently
          # never ran; the count comes from the source, and is deliberately a literal here so that
          # adding or losing a test is a visible change to this number.
          REQUIRED_CLASS="me.rerere.rikkahub.data.claudep.ClaudePKoinGraphTest"
          EXPECTED_TESTS=7

          python3 - "$REQUIRED_CLASS" "$EXPECTED_TESTS" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          required, expected = sys.argv[1], int(sys.argv[2])
          files = sorted(glob.glob("app/build/outputs/androidTest-results/**/*.xml", recursive=True))
          total = failures = errors = skipped = 0
          names = []
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for suite in ([root] if root.tag == "testsuite" else root.iter("testsuite")):
                  if suite.get("name") != required:
                      continue
                  for case in suite.iter("testcase"):
                      total += 1
                      names.append(case.get("name"))
                      if case.find("failure") is not None: failures += 1
                      if case.find("error") is not None: errors += 1
                      if case.find("skipped") is not None: skipped += 1
          print(f"{required}: tests={total} failures={failures} errors={errors} skipped={skipped}")
          for n in sorted(names):
              print(f"  PASS {n}")
          ok = True
          if total != expected:
              print(f"::error::{required} ran {total} tests, expected {expected}")
              ok = False
          if failures or errors or skipped:
              print(f"::error::{required} had failures={failures} errors={errors} skipped={skipped}")
              ok = False
          raise SystemExit(0 if ok else 1)
          PY

      # The runner-arg filter is a whitelist that matches nothing silently, so naming a class in
      # CLASSES is not evidence that it ran. This asserts the v52 migration suite by class name
      # AND by its exact executed test count: a class-name-only check would still pass if some of
      # its methods never ran, and the count is a literal here on purpose so that adding or losing
      # a test is a visible change to this number rather than a silent one.
      - name: Verify the v52 migration suite executed
        if: always()
        run: |
          set -uo pipefail
          REQUIRED_CLASS="me.rerere.rikkahub.data.db.migrations.Migration_51_52_Test"
          EXPECTED_TESTS=4

          python3 - "$REQUIRED_CLASS" "$EXPECTED_TESTS" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          required, expected = sys.argv[1], int(sys.argv[2])
          files = sorted(glob.glob("app/build/outputs/androidTest-results/**/*.xml", recursive=True))
          total = failures = errors = skipped = 0
          names = []
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for suite in ([root] if root.tag == "testsuite" else root.iter("testsuite")):
                  if suite.get("name") != required:
                      continue
                  for case in suite.iter("testcase"):
                      total += 1
                      names.append(case.get("name"))
                      if case.find("failure") is not None: failures += 1
                      if case.find("error") is not None: errors += 1
                      if case.find("skipped") is not None: skipped += 1
          print(f"{required}: tests={total} failures={failures} errors={errors} skipped={skipped}")
          for n in sorted(names):
              print(f"  PASS {n}")
          ok = True
          if total != expected:
              print(f"::error::{required} ran {total} tests, expected {expected}")
              ok = False
          if failures or errors or skipped:
              print(f"::error::{required} had failures={failures} errors={errors} skipped={skipped}")
              ok = False
          raise SystemExit(0 if ok else 1)
          PY

      - name: Report managed device identity
        if: always()
        run: |
          echo "=== managed device config ==="
          sed -n '/managedDevices/,/^        }/p' app/build.gradle.kts
          echo "=== managed device logs (if any) ==="
          find app/build/outputs -path '*managed_device*' -name '*.txt' 2>/dev/null | head
          find app/build/outputs -name 'logcat*' 2>/dev/null | head

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-instrumentation-results
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
            # KSP writes the exported Room schema here during the build. It is the only place the
            # generated identity hash exists, and androidTest assets are merged before KSP runs, so
            # a newly added schema version is invisible to the instrumentation tests until its file
            # has been committed. Uploading it is what makes that value recoverable.
            app/schemas/**
          if-no-files-found: warn
