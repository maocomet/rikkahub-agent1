name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # :web:installWebUiDeps runs `bun install --frozen-lockfile` but web-ui/
      # only tracks pnpm-lock.yaml (no bun.lock), so the frozen install cannot
      # run on a clean checkout. Installing up-front also makes the Gradle task
      # up-to-date on the first build (its outputs.dir is node_modules/).
      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Pre-install web-ui dependencies
        working-directory: web-ui
        run: bun install

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
