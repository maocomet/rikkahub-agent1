name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # :web:installWebUiDeps runs `bun install --frozen-lockfile` but web-ui/
      # only tracks pnpm-lock.yaml (no bun.lock), so the frozen install cannot
      # run on a clean checkout. Installing up-front also makes the Gradle task
      # up-to-date on the first build (its outputs.dir is node_modules/).
      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      # web-ui/pnpm-workspace.yaml declares allowBuilds (pnpm>=10 syntax) and no
      # packages field; pnpm 9 rejects that with "packages field missing or empty".
      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Pre-install web-ui dependencies
        working-directory: web-ui
        run: bun install

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # .agenttest builds shipped from CI must keep ONE signing identity so testers can install a
      # new build over the old one (and keep app data) instead of uninstalling first. The fixed
      # keystore is never committed: it lives base64-encoded in a repo Secret and is decoded here.
      # Missing secrets FAIL the job loudly — never fall back to AGP's throwaway per-run debug key.
      - name: Materialize fixed .agenttest signing keystore
        env:
          AGENTTEST_KEYSTORE_B64: ${{ secrets.RIKKAHUB_AGENTTEST_KEYSTORE_BASE64 }}
          AGENTTEST_STORE_PASSWORD: ${{ secrets.RIKKAHUB_AGENTTEST_STORE_PASSWORD }}
          AGENTTEST_KEY_ALIAS: ${{ secrets.RIKKAHUB_AGENTTEST_KEY_ALIAS }}
          AGENTTEST_KEY_PASSWORD: ${{ secrets.RIKKAHUB_AGENTTEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${AGENTTEST_KEYSTORE_B64:?Missing RIKKAHUB_AGENTTEST_KEYSTORE_BASE64 secret — see docs/agenttest-fixed-signing.md}"
          : "${AGENTTEST_STORE_PASSWORD:?Missing RIKKAHUB_AGENTTEST_STORE_PASSWORD secret}"
          : "${AGENTTEST_KEY_ALIAS:?Missing RIKKAHUB_AGENTTEST_KEY_ALIAS secret}"
          : "${AGENTTEST_KEY_PASSWORD:?Missing RIKKAHUB_AGENTTEST_KEY_PASSWORD secret}"
          KEYSTORE="$RUNNER_TEMP/rikkahub-agenttest.keystore"
          echo "$AGENTTEST_KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::Decoded keystore is empty — check RIKKAHUB_AGENTTEST_KEYSTORE_BASE64"
            exit 1
          fi
          # Confirm the keystore opens and the alias exists before spending a build on it.
          keytool -list -keystore "$KEYSTORE" \
            -storepass "$AGENTTEST_STORE_PASSWORD" -alias "$AGENTTEST_KEY_ALIAS" >/dev/null
          # Export for the Gradle and verification steps below.
          echo "RIKKAHUB_AGENTTEST_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "RIKKAHUB_AGENTTEST_STORE_PASSWORD=$AGENTTEST_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RIKKAHUB_AGENTTEST_KEY_ALIAS=$AGENTTEST_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RIKKAHUB_AGENTTEST_KEY_PASSWORD=$AGENTTEST_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          # Fail closed: Gradle must refuse to fall back to a throwaway debug signature.
          RIKKAHUB_AGENTTEST_REQUIRED: "true"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # Prove the produced APKs really are signed by the fixed keystore (not AGP's throwaway debug
      # key) and print the certificate SHA-256. Same keystore every run => identical fingerprint,
      # which is what lets testers overwrite-install future builds.
      - name: Verify .agenttest APKs use the fixed signing key
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found under \$ANDROID_HOME/build-tools; skipping cert comparison"
            exit 0
          fi
          expected="$(
            keytool -list -v -keystore "$RIKKAHUB_AGENTTEST_KEYSTORE" \
              -storepass "$RIKKAHUB_AGENTTEST_STORE_PASSWORD" \
              -alias "$RIKKAHUB_AGENTTEST_KEY_ALIAS" \
              | sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
              | head -n1 | tr -d ':' | tr 'A-F' 'a-f'
          )"
          [ -n "$expected" ] || { echo "::error::Could not read certificate from the agent-test keystore"; exit 1; }
          for apk in "$GITHUB_WORKSPACE"/app/build/outputs/apk/debug/*.apk; do
            [ -f "$apk" ] || continue
            actual="$(
              "$APKSIGNER" verify --print-certs "$apk" \
              | sed -nE 's/^.*SHA-256 digest: ([0-9A-Fa-f:]+)$/\1/p' \
              | head -n1 | tr -d ':' | tr 'A-F' 'a-f'
            )"
            [ -n "$actual" ] || { echo "::error::Could not read signing certificate from $apk"; exit 1; }
            if [ "$actual" != "$expected" ]; then
              echo "::error::$apk is NOT signed by the fixed agent-test keystore (expected $expected, got $actual)"
              exit 1
            fi
            echo "$(basename "$apk") -> fixed agent-test key sha256: $actual"
          done

      # Regression: a brand-new ordinary chat must be able to send its first message.
      # Scoped to :app so the --tests filter does not fail sibling modules that have
      # no matching test class (Gradle errors on an empty --tests match per module).
      # Second-user tool allowlist unit tests are pinned here so the new/edited tests
      # actually run in CI (the step intentionally does not run the full suite).
      - name: Run regression unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests "me.rerere.rikkahub.service.ShouldMaterializeConversationAtFirstSendTest" \
            --tests "me.rerere.rikkahub.data.ai.mcp.McpOAuthAuthRulesTest" \
            --tests "me.rerere.rikkahub.data.ai.tools.SecondUserToolAllowlistTest" \
            --tests "me.rerere.rikkahub.data.datastore.SecondUserToolSettingsSerializationTest" \
            --tests "me.rerere.rikkahub.owner.OwnerManagementToolsTest" \
            --tests "me.rerere.rikkahub.data.ai.mcp.oauth.OAuthTokenEndpointErrorParsingTest" \
            --tests "me.rerere.rikkahub.data.ai.tools.local.VolumeToolTest" \
            --tests "me.rerere.rikkahub.workflow.model.WorkflowToolSchemaSurfaceParityTest" \
            --tests "me.rerere.rikkahub.workflow.model.WorkflowRunSurfaceRegressionTest" \
            --tests "me.rerere.rikkahub.data.ai.execution.ToolRuntimeGlobalLockReentrancyTest" \
            --tests "me.rerere.rikkahub.data.model.AssistantConversationHistoryToolsSerializationTest" \
            --tests "me.rerere.rikkahub.data.ai.OrdinaryAssistantConversationToolSurfaceTest" \
            --tests "me.rerere.rikkahub.data.ai.ToolCostGuidanceSurfaceTest" \
            --tests "me.rerere.rikkahub.data.ai.TransientConversationToolSanitizerTest" \
            --tests "me.rerere.rikkahub.data.ai.TransientConversationToolIdentityTest" \
            --tests "me.rerere.rikkahub.data.db.AppDatabaseSchemaIdentityContractTest" \
            --tests "me.rerere.rikkahub.data.execution.ApprovalContinuationModeTest" \
            --tests "me.rerere.rikkahub.data.db.ImportedDatabaseReconcilerContractTest" \
            --tests "me.rerere.rikkahub.space.SpaceRepositoryTest" \
            --tests "me.rerere.rikkahub.space.SpaceToolSurfaceTest" \
            --tests "me.rerere.rikkahub.space.SpaceAssistantFootprintTest" \
            --tests "me.rerere.rikkahub.data.ai.execution.SpaceToolRuntimeRegistrationTest" \
            --tests "me.rerere.rikkahub.data.repository.AssistantRemovalServiceTest" \
            --tests "me.rerere.rikkahub.data.repository.AssistantRemovalServiceWiringTest" \
            --tests "me.rerere.rikkahub.ui.pages.space.CatGardenVMTest" \
            --tests "me.rerere.rikkahub.workflow.trigger.SpaceNotificationTriggerGuardTest" \
            --tests "me.rerere.rikkahub.workflow.trigger.SpaceNotificationEndToEndTest" \
            --tests "me.rerere.rikkahub.workflow.model.SpaceNotificationTriggerJsonTest" \
            --tests "me.rerere.rikkahub.sticker.StickerFileStoreTest" \
            --tests "me.rerere.rikkahub.sticker.StickerRepositoryTest" \
            --tests "me.rerere.rikkahub.sticker.StickerVisionParserTest" \
            --tests "me.rerere.rikkahub.sticker.StickerImportCoordinatorTest" \
            --tests "me.rerere.rikkahub.ui.pages.sticker.StickerLibraryVMTest" \
            --tests "me.rerere.rikkahub.sticker.StickerSearchTest" \
            --tests "me.rerere.rikkahub.sticker.StickerToolSurfaceTest" \
            --tests "me.rerere.rikkahub.sticker.StickerDeliveryTest" \
            --tests "me.rerere.rikkahub.sticker.StickerSendToMessagePartTransformerTest" \
            --tests "me.rerere.rikkahub.data.ai.execution.StickerToolRuntimeRegistrationTest"

      # The allowlist above pins explicit --tests patterns, and Gradle only fails when the
      # COMBINED filter matches nothing -- a single pattern that matches no class is silent.
      # Gradle's test logging is off project-wide, so the run log never lists classes. Printing
      # the JUnit XML basenames is what actually proves a pinned class executed rather than only
      # compiled.
      - name: Report executed regression test classes
        if: always()
        run: |
          results=app/build/test-results/testDebugUnitTest
          if [ ! -d "$results" ]; then
            echo "::error::No test results at $results -- did :app:testDebugUnitTest run?"
            exit 1
          fi
          echo "Executed test classes:"
          find "$results" -name '*.xml' -exec basename {} .xml \; | sort

      # Claude P provider (Gate CP1-A) focused tests.
      #
      # These need their own step for two reasons, both of which meant the CP1-A tests would
      # otherwise never execute:
      #   1. No workflow runs :ai unit tests at all, and every Claude P protocol/gateway/provider
      #      test lives in :ai.
      #   2. The :app step above pins an explicit --tests allowlist, so new :app test classes
      #      compile there but are never run.
      # Pinned by class name so an unrelated pre-existing :ai failure cannot break this job.
      - name: Run Claude P provider unit tests (CP1-A)
        run: |
          chmod +x gradlew
          ./gradlew :ai:testDebugUnitTest \
            --tests "me.rerere.ai.provider.claudep.*" \
            --tests "me.rerere.ai.provider.providers.ClaudePProviderStreamTest" \
            --tests "me.rerere.ai.provider.providers.ClaudePProviderIdentityTest" \
            --tests "me.rerere.ai.provider.providers.ClaudePProviderCancellationTest" \
            --tests "me.rerere.ai.provider.ClaudePSettingTest" \
            --tests "me.rerere.ai.provider.ProviderManagerClaudePTest"
          # The LAST :app:testDebugUnitTest invocation in this job owns
          # app/build/test-results/testDebugUnitTest: re-running the task with a different
          # --tests filter replaces that directory, discarding the XML the regression step
          # above produced. So every app class the reporting step below requires must be
          # named here -- otherwise its XML is gone by the time that step reads the
          # directory, and the gate reports "compiled but did not run" for a class that ran
          # and passed. `ApprovalContinuationModeTest` is run by the regression step for its
          # own reasons and is listed here for exactly that reason, not because this step is
          # where it belongs.
          ./gradlew :app:testDebugUnitTest \
            --tests "me.rerere.rikkahub.data.ai.background.ClaudePBackgroundExclusionTest" \
            --tests "me.rerere.rikkahub.data.claudep.ClaudePDevicePairingRepositoryTest" \
            --tests "me.rerere.rikkahub.ui.pages.setting.components.ClaudePProviderConfigureTest" \
            --tests "me.rerere.rikkahub.data.execution.ApprovalContinuationModeTest"

      # Compiling is not running. Gradle only fails when the COMBINED filter matches nothing, and
      # its test logging is off project-wide, so the JUnit XML basenames are the proof.
      - name: Report executed Claude P test classes
        if: always()
        run: |
          set -uo pipefail
          # Every class below is REQUIRED to have produced a JUnit XML. Listing the expected set
          # explicitly is the point: `--tests` filters only fail when the COMBINED filter matches
          # nothing, so a single renamed or dropped class is otherwise invisible, and "at least one
          # ClaudeP XML exists" would pass while most of the suite silently never ran.
          REQUIRED=(
            "ai:me.rerere.ai.provider.claudep.ClaudePCleanupTombstoneCodecTest"
            "ai:me.rerere.ai.provider.claudep.ClaudePConfigureUiTest"
            "ai:me.rerere.ai.provider.claudep.ClaudePConformanceCorpusTest"
            "ai:me.rerere.ai.provider.claudep.ClaudePCredentialStoreTest"
            "ai:me.rerere.ai.provider.claudep.ClaudePEndpointTest"
            "ai:me.rerere.ai.provider.claudep.ClaudePFakeGatewayTest"
            "ai:me.rerere.ai.provider.claudep.ClaudePImportSanitizerTest"
            "ai:me.rerere.ai.provider.claudep.ClaudePOkHttpTest"
            "ai:me.rerere.ai.provider.claudep.ClaudePPairingCoordinatorTest"
            "ai:me.rerere.ai.provider.claudep.ClaudePPairingFlowTest"
            "ai:me.rerere.ai.provider.claudep.ClaudePProtocolTest"
            "ai:me.rerere.ai.provider.claudep.ClaudePRequestFingerprintTest"
            "ai:me.rerere.ai.provider.claudep.ClaudePRevocationTest"
            "ai:me.rerere.ai.provider.claudep.ClaudePResolvingClientTest"
            "ai:me.rerere.ai.provider.claudep.ClaudePUiStatusTest"
            "ai:me.rerere.ai.provider.claudep.ClaudePWssTransportTest"
            "ai:me.rerere.ai.provider.claudep.bridge.BridgeGenerationRegistryTest"
            "ai:me.rerere.ai.provider.claudep.bridge.ClaudePToolBridgeTest"
            "ai:me.rerere.ai.provider.claudep.bridge.BridgeConformanceCorpusTest"
            "ai:me.rerere.ai.provider.claudep.ClaudePToolFrameTest"
            "ai:me.rerere.ai.provider.claudep.ClaudePToolGenerationContextTest"
            "ai:me.rerere.ai.provider.claudep.ClaudePToolWireRulesTest"
            "ai:me.rerere.ai.provider.providers.ClaudePProviderCancellationTest"
            "ai:me.rerere.ai.provider.providers.ClaudePProviderStreamTest"
            "ai:me.rerere.ai.provider.providers.ClaudePProviderIdentityTest"
            "ai:me.rerere.ai.provider.ClaudePSettingTest"
            "ai:me.rerere.ai.provider.ProviderManagerClaudePTest"
            "app:me.rerere.rikkahub.data.execution.ApprovalContinuationModeTest"
            "app:me.rerere.rikkahub.data.ai.background.ClaudePBackgroundExclusionTest"
            "app:me.rerere.rikkahub.data.claudep.ClaudePDevicePairingRepositoryTest"
            "app:me.rerere.rikkahub.ui.pages.setting.components.ClaudePProviderConfigureTest"
          )

          missing=0
          for entry in "${REQUIRED[@]}"; do
            module="${entry%%:*}"
            class="${entry#*:}"
            if [ "$module" = "ai" ]; then
              results=ai/build/test-results/testDebugUnitTest
            else
              results=app/build/test-results/testDebugUnitTest
            fi
            found=0
            if [ -d "$results" ]; then
              while read -r xml; do
                [ -n "$xml" ] || continue
                # Compare the XML's own class name, not the file name: an inner-class or a renamed
                # file must not be able to satisfy an entry it does not match.
                if grep -q "name=\"$class\"" "$xml"; then
                  found=1
                  # An XML that EXISTS is not an XML that RAN. Gradle writes a suite element even
                  # for a class whose every case was filtered out or skipped, so "the file is
                  # there" would pass while the class verified nothing. Read the suite's own
                  # counters, which are the only statement about what actually executed.
                  counts=$(grep -o '<testsuite[^>]*>' "$xml" | head -1)
                  n_tests=$(printf '%s' "$counts" | grep -o 'tests="[0-9]*"' | head -1 | tr -dc '0-9')
                  n_skip=$(printf '%s' "$counts" | grep -o 'skipped="[0-9]*"' | head -1 | tr -dc '0-9')
                  n_fail=$(printf '%s' "$counts" | grep -o 'failures="[0-9]*"' | head -1 | tr -dc '0-9')
                  n_err=$(printf '%s' "$counts" | grep -o 'errors="[0-9]*"' | head -1 | tr -dc '0-9')
                  if [ "${n_tests:-0}" -eq 0 ]; then
                    echo "::error::$class produced a JUnit XML reporting 0 tests — it compiled but verified nothing."
                    missing=$((missing + 1))
                  elif [ "${n_skip:-0}" -ne 0 ]; then
                    # skipped is not passed. A suite that skips is a suite that did not check.
                    echo "::error::$class reported ${n_skip} skipped test(s); skipped must not be treated as passing."
                    missing=$((missing + 1))
                  elif [ "${n_fail:-0}" -ne 0 ] || [ "${n_err:-0}" -ne 0 ]; then
                    echo "::error::$class reported ${n_fail} failure(s) and ${n_err} error(s)."
                    missing=$((missing + 1))
                  else
                    echo "executed: $class (${n_tests} tests, 0 skipped)"
                  fi
                fi
              done < <(find "$results" -name '*.xml' | sort)
            fi
            if [ "$found" -ne 1 ]; then
              echo "::error::No JUnit XML for required Claude P test class $class — it compiled but did not run, or was renamed."
              missing=$((missing + 1))
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing required Claude P test class(es) produced no results."
            exit 1
          fi
          echo "All ${#REQUIRED[@]} required Claude P test classes executed."

      # The conformance corpus is the shared artifact between this repository and the server
      # implementation, so it gets its own gate rather than riding on the class-level one.
      #
      # Four separate things can go wrong and they need four different checks:
      #   1. the corpus files were edited without regenerating the manifest -- so the manifest
      #      is verified against the files on disk, not merely read;
      #   2. the corpus drifted from the specification it was derived from -- so the revision
      #      is pinned here as well as asserted by the test;
      #   3. the tests ran, but not all of them -- so the executed count is pinned exactly.
      #      A pinned count is brittle on purpose: adding a case means editing this number,
      #      which is the moment someone notices the corpus changed;
      #   4. the tests ran and failed -- which an earlier version of this step did NOT check.
      #      It read `tests` and `skipped` and ignored `failures` and `errors`, so it printed
      #      "executed exactly 14 tests, none skipped" while two of those tests were failing.
      #      The overall build still failed (the per-class step checks failures), but this
      #      step's own claim was stronger than what it verified. That is fixed below, and
      #      the self-test asserts it stays fixed.
      - name: Verify the conformance corpus gate
        if: always()
        run: |
          set -uo pipefail

          EXPECTED_CONFORMANCE_TESTS=14
          EXPECTED_SPEC_REVISION=v1-r3
          SUITE_CLASS=me.rerere.ai.provider.claudep.ClaudePConformanceCorpusTest
          xml="ai/build/test-results/testDebugUnitTest/TEST-$SUITE_CLASS.xml"

          if [ ! -f claudep/conformance/MANIFEST.sha256 ]; then
            echo "::error::claudep/conformance/MANIFEST.sha256 is missing from the checkout; the conformance test cannot verify anything."
            exit 1
          fi

          # Run from inside the directory: the manifest records paths relative to it.
          if ! (cd claudep/conformance && sha256sum -c MANIFEST.sha256); then
            echo "::error::The conformance corpus does not match its manifest. Either the corpus was edited without regenerating it, or the vendored copy diverged. Regenerate with claudep/conformance/tools/build-corpus.mjs -- do not hand-edit the manifest."
            exit 1
          fi

          revision=$(sed -n 's/.*"spec_revision"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' claudep/conformance/SPEC_REVISION.json)
          if [ -z "$revision" ]; then
            echo "::error::SPEC_REVISION.json records no spec_revision; the corpus cannot be tied to a specification revision."
            exit 1
          fi
          if [ "$revision" != "$EXPECTED_SPEC_REVISION" ]; then
            echo "::error::Conformance corpus is at revision '$revision' but this workflow expects '$EXPECTED_SPEC_REVISION'. Re-vendoring a newer corpus is a deliberate change: update EXPECTED_SPEC_REVISION in the same commit."
            exit 1
          fi
          echo "Conformance corpus verified against specification revision $revision."

          # Decides whether a JUnit suite file is an acceptable result for the corpus class.
          # Prints a reason and returns non-zero when it is not.
          #
          # Reads the suite element's own counters, never the file's existence: Gradle writes
          # a testsuite element even for a class whose every case was filtered out or
          # skipped, so "the XML is there" would pass while the corpus verified nothing.
          check_suite() {
            file="$1"
            if [ ! -f "$file" ]; then
              echo "no JUnit XML at $file"
              return 1
            fi
            suites=$(grep -o '<testsuite' "$file" | wc -l | tr -dc '0-9')
            if [ "${suites:-0}" -ne 1 ]; then
              echo "expected exactly one <testsuite> element, found ${suites:-0}"
              return 1
            fi
            counts=$(grep -o '<testsuite[^>]*>' "$file" | head -1)
            tests=$(printf '%s' "$counts" | grep -o 'tests="[0-9]*"' | head -1 | tr -dc '0-9')
            skipped=$(printf '%s' "$counts" | grep -o 'skipped="[0-9]*"' | head -1 | tr -dc '0-9')
            failures=$(printf '%s' "$counts" | grep -o 'failures="[0-9]*"' | head -1 | tr -dc '0-9')
            errors=$(printf '%s' "$counts" | grep -o 'errors="[0-9]*"' | head -1 | tr -dc '0-9')
            if [ "${failures:-0}" -ne 0 ]; then
              echo "reported ${failures} failure(s)"
              return 1
            fi
            if [ "${errors:-0}" -ne 0 ]; then
              echo "reported ${errors} error(s)"
              return 1
            fi
            if [ "${skipped:-0}" -ne 0 ]; then
              # Skipped is not passed. The corpus is the shared contract with the server
              # implementation; a skipped case is a case where the contract went unverified.
              echo "reported ${skipped} skipped test(s)"
              return 1
            fi
            if [ "${tests:-0}" -ne "$EXPECTED_CONFORMANCE_TESTS" ]; then
              echo "executed ${tests:-0} tests, expected $EXPECTED_CONFORMANCE_TESTS"
              return 1
            fi
            return 0
          }

          # Self-test first. A gate that has stopped firing reads as a control while
          # providing none, so the checker is exercised against synthetic suites before it
          # is trusted with the real one -- including the two cases (failures, errors) that
          # the previous version of this step silently accepted.
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT

          synth() {
            printf '<testsuite name="%s" tests="%s" skipped="%s" failures="%s" errors="%s" time="1.0"></testsuite>\n' \
              "$SUITE_CLASS" "$2" "$3" "$4" "$5" > "$1"
          }

          selftest_failures=0
          expect_accept() {
            if ! check_suite "$1" >/dev/null 2>&1; then
              echo "::error::self-test: expected ACCEPT for $2, got a rejection"
              selftest_failures=$((selftest_failures + 1))
            fi
          }
          expect_reject() {
            if check_suite "$1" >/dev/null 2>&1; then
              echo "::error::self-test: expected REJECT for $2, got an acceptance"
              selftest_failures=$((selftest_failures + 1))
            fi
          }

          synth "$tmpdir/ok.xml"    14 0 0 0; expect_accept "$tmpdir/ok.xml"    "14 tests, none skipped or failing"
          synth "$tmpdir/zero.xml"   0 0 0 0; expect_reject "$tmpdir/zero.xml"  "zero tests executed"
          synth "$tmpdir/skip.xml"  14 1 0 0; expect_reject "$tmpdir/skip.xml"  "one skipped test"
          synth "$tmpdir/count.xml" 13 0 0 0; expect_reject "$tmpdir/count.xml" "a wrong test count"
          synth "$tmpdir/fail.xml"  14 0 1 0; expect_reject "$tmpdir/fail.xml"  "one failing test"
          synth "$tmpdir/err.xml"   14 0 0 1; expect_reject "$tmpdir/err.xml"   "one errored test"
          expect_reject "$tmpdir/does-not-exist.xml" "a missing suite file"
          printf '<testsuite/><testsuite/>\n' > "$tmpdir/dup.xml"; expect_reject "$tmpdir/dup.xml" "two suite elements"

          if [ "$selftest_failures" -ne 0 ]; then
            echo "::error::the conformance XML gate failed $selftest_failures self-test case(s); its verdict on the real suite cannot be trusted."
            exit 1
          fi
          echo "Conformance XML gate self-test: 8 cases behaved as expected."

          if ! check_suite "$xml"; then
            echo "::error::ClaudePConformanceCorpusTest did not produce an acceptable result (see the reason above). The suite must exist exactly once, with tests=$EXPECTED_CONFORMANCE_TESTS and no failures, errors or skips."
            exit 1
          fi
          echo "ClaudePConformanceCorpusTest executed exactly $EXPECTED_CONFORMANCE_TESTS tests, none skipped and none failing."

      # The JUnit XML is the only place a failing assertion's message appears. Gradle's test
      # logging is off project-wide, so the console shows an exception type and a line number
      # and nothing else -- which is exactly what happened: a run failed and the divergent
      # frame could be located but not identified, costing a whole CI round to learn nothing.
      #
      # Uploaded `if: always()`, because the artifact matters most when the run failed. The
      # name carries the run id and the commit, so a downloaded file is traceable back to
      # the run it came from, and it contains no secret -- only test names, timings and
      # assertion messages from synthetic corpus fixtures.
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ github.run_id }}-${{ github.sha }}
          path: |
            ai/build/test-results/testDebugUnitTest/*.xml
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Diagnose web-ui build (on failure)
        if: failure()
        working-directory: web-ui
        run: |
          echo "=== pnpm $(pnpm -v 2>/dev/null) / node $(node -v 2>/dev/null) ==="
          echo "=== retry: pnpm run build (tail 100) ==="
          pnpm run build 2>&1 | tail -100 || true

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
